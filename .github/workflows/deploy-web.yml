# Deploys apps/web to S3 + CloudFront on every main push that touches it.
# Auth: OIDC → gha-autovend-web-deploy (trust scoped to refs/heads/main).
# No AWS keys anywhere. Role/bucket/distribution ids live in repo variables.
name: deploy-web

on:
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - "packages/**"
      - ".github/workflows/deploy-web.yml"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-web
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy-web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @autovend/contracts build
      - run: pnpm --filter @autovend/web build

      - uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_WEB_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      # Hashed assets are immutable; HTML must revalidate every time.
      - name: Sync immutable assets
        run: >
          aws s3 sync apps/web/build/client "s3://${{ vars.WEB_BUCKET }}"
          --delete --exclude "*.html"
          --cache-control "public,max-age=31536000,immutable"

      - name: Sync HTML (no-cache)
        run: >
          aws s3 sync apps/web/build/client "s3://${{ vars.WEB_BUCKET }}"
          --exclude "*" --include "*.html"
          --cache-control "no-cache"

      - name: Invalidate CloudFront
        run: >
          aws cloudfront create-invalidation
          --distribution-id "${{ vars.CF_DISTRIBUTION_ID }}"
          --paths "/*"
