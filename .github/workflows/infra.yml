# Terraform for infra/envs/prod: plan on PRs (read-only role, no lock),
# apply on main behind the `production` environment approval.
# Backend config comes from repo variables — nothing account-linked in git.
name: infra

on:
  pull_request:
    paths:
      - "infra/**"
      - ".github/workflows/infra.yml"
  push:
    branches: [main]
    paths:
      - "infra/**"
      - ".github/workflows/infra.yml"

permissions:
  id-token: write
  contents: read

concurrency:
  group: infra-${{ github.ref }}
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  WORKDIR: infra/envs/prod

jobs:
  plan:
    name: plan
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.15.8"

      - uses: aquasecurity/tfsec-action@b466648d6e39e7c75324f25d83891162a721f2d6 # v1.0.3
        with:
          working_directory: infra
          additional_args: --minimum-severity HIGH

      - uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_INFRA_PLAN_ROLE_ARN }}
          aws-region: us-east-1

      - run: terraform fmt -check -recursive infra
      - name: Init
        working-directory: ${{ env.WORKDIR }}
        run: >
          terraform init -input=false
          -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"
          -backend-config="key=prod/terraform.tfstate"
          -backend-config="region=us-east-1"
          -backend-config="use_lockfile=true"
      - name: Validate
        working-directory: ${{ env.WORKDIR }}
        run: terraform validate
      - name: Plan
        working-directory: ${{ env.WORKDIR }}
        run: |
          terraform plan -input=false -lock=false -no-color 2>&1 | tee plan.txt
          {
            echo "## Terraform plan (prod)"
            echo '```'
            tail -c 60000 plan.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  apply:
    name: apply
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.15.8"

      - uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_INFRA_APPLY_ROLE_ARN }}
          aws-region: us-east-1

      - name: Init
        working-directory: ${{ env.WORKDIR }}
        run: >
          terraform init -input=false
          -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"
          -backend-config="key=prod/terraform.tfstate"
          -backend-config="region=us-east-1"
          -backend-config="use_lockfile=true"
      - name: Apply
        working-directory: ${{ env.WORKDIR }}
        run: terraform apply -input=false -auto-approve
